name: Deploy Angular to GitHub Pages

on:
  # Runs on pushes targeting the default branch (main or master)
  push:
    branches:
      - main
      - develop
      - master

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build with Angular
        # IMPORTANT: If your repository is not at the root (e.g. username.github.io/FoodyBhai),
        # uncomment the below line and replace 'FoodyBhai' with your repository name.
        # run: npm run build -- --base-href /FoodyBhai/
        
        # Default build command:
        run: npm run build -- --configuration production
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # In Angular 17+, the static files are output to dist/project-name/browser
          # Because your project is 'foody-bhai', the path is dist/foody-bhai/browser
          path: 'dist/foody-bhai/browser'

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
