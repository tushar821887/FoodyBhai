name: Deploy Angular to Hostinger

on:
  # Runs on pushes targeting the default branch (main or master)
  push:
    branches:
      - main
      - master
  
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build with Angular
        # Assuming you will host this on a custom domain (e.g., foodybhai.com)
        run: npm run build -- --configuration production
        
      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Path where Angular outputs the compiled static files
          local-dir: dist/foody-bhai/browser/
          # Optional: define where to upload on Hostinger (e.g., public_html)
          # server-dir: /public_html/
