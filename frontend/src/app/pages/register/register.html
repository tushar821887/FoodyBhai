<div class="page-header">
  <div class="container text-center animate-fade-in">
    <h1 class="page-title">Join <span>Foody Bhai</span></h1>
    <p class="page-subtitle">Create an account to start ordering delicious food.</p>
  </div>
</div>

<section class="section">
  <div class="container">
    <div class="auth-container animate-fade-in" style="max-width: 500px; margin: 0 auto; background: #fff; padding: 3rem; border-radius: var(--border-radius); box-shadow: var(--shadow-lg); border: 1px solid rgba(0,0,0,0.05);">
      
      <form class="auth-form" (ngSubmit)="onSubmit()">
        <h3 class="form-title" style="font-size: 1.8rem; margin-bottom: 2rem; color: var(--secondary-color); text-align: center;">Register</h3>
        
        @if (errorMessage) {
          <div class="alert" style="background: #ffebee; color: #c62828; padding: 1rem; border-radius: 8px; margin-bottom: 1.5rem; border-left: 4px solid #c62828;">
            <i class="fa-solid fa-circle-exclamation"></i> {{ errorMessage }}
          </div>
        }
        
        <div class="form-group" style="margin-bottom: 1.5rem;">
          <label for="name" style="display: block; font-weight: 500; margin-bottom: 0.5rem; color: var(--secondary-color);">Full Name *</label>
          <input type="text" id="name" name="name" [(ngModel)]="registerData.name" class="form-control" placeholder="John Doe" required [disabled]="isLoading">
        </div>
        
        <div class="form-group" style="margin-bottom: 1.5rem;">
          <label for="email" style="display: block; font-weight: 500; margin-bottom: 0.5rem; color: var(--secondary-color);">Email Address *</label>
          <input type="email" id="email" name="email" [(ngModel)]="registerData.email" class="form-control" placeholder="john@example.com" required [disabled]="isLoading">
        </div>

        <div class="form-group" style="margin-bottom: 1.5rem;">
          <label for="phone" style="display: block; font-weight: 500; margin-bottom: 0.5rem; color: var(--secondary-color);">Phone Number</label>
          <input type="tel" id="phone" name="phone" [(ngModel)]="registerData.phone" class="form-control" placeholder="9876543210" [disabled]="isLoading">
        </div>
        
        <div class="form-group" style="margin-bottom: 1.5rem;">
          <label for="password" style="display: block; font-weight: 500; margin-bottom: 0.5rem; color: var(--secondary-color);">Password *</label>
          <input type="password" id="password" name="password" [(ngModel)]="registerData.password" class="form-control" placeholder="••••••••" required [disabled]="isLoading">
        </div>

        <div class="form-group" style="margin-bottom: 1.5rem;">
          <label for="confirmPassword" style="display: block; font-weight: 500; margin-bottom: 0.5rem; color: var(--secondary-color);">Confirm Password *</label>
          <input type="password" id="confirmPassword" name="confirmPassword" [(ngModel)]="registerData.confirmPassword" class="form-control" placeholder="••••••••" required [disabled]="isLoading">
        </div>
        
        <button type="submit" class="btn btn-primary btn-block" style="width: 100%; display: flex; justify-content: center; align-items: center; gap: 0.5rem; padding: 1rem; font-size: 1.1rem; margin-top: 1rem;" [disabled]="isLoading">
          @if (isLoading) {
            <i class="fa-solid fa-circle-notch fa-spin"></i> Registering...
          } @else {
            Register <i class="fa-solid fa-user-plus"></i>
          }
        </button>

        <p style="text-align: center; margin-top: 2rem; color: var(--text-light);">
          Already have an account? <a routerLink="/login" style="color: var(--primary-color); font-weight: 600;">Login here</a>
        </p>
      </form>
    </div>
  </div>
</section>
