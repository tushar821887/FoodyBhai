<!-- Dynamic Page Content if route matched CMS -->
<div *ngIf="matchedPage" class="cms-dynamic-page-wrap">
  @for (section of (matchedPage?.sections || []); track trackBySection($index, section)) {
    <app-dynamic-section-renderer [section]="section"></app-dynamic-section-renderer>
  }
</div>

<!-- Standard 404 Fallback if not matched -->
<div *ngIf="!isLoading && !matchedPage" class="container text-center section" style="padding: 10rem 0;">
  <i class="fa-solid fa-triangle-exclamation" style="font-size: 5rem; color: var(--primary-color); margin-bottom: 2rem;"></i>
  <h1 class="page-title">Page Not Found</h1>
  <p class="page-subtitle mb-4">Sorry, the page or recipe you are looking for does not exist.</p>
  <a routerLink="/menu" class="btn btn-primary">Browse Menu</a>
</div>
