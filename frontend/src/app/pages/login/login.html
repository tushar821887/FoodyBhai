<div class="page-header">
  <div class="container text-center animate-fade-in">
    <h1 class="page-title">Welcome <span>Back</span></h1>
    <p class="page-subtitle">Login to your account to order your favorite food.</p>
  </div>
</div>

<section class="section">
  <div class="container">
    <div class="auth-container animate-fade-in" style="max-width: 500px; margin: 0 auto; background: #fff; padding: 3rem; border-radius: var(--border-radius); box-shadow: var(--shadow-lg); border: 1px solid rgba(0,0,0,0.05);">
      
      <form class="auth-form" (ngSubmit)="onSubmit()">
        <h3 class="form-title" style="font-size: 1.8rem; margin-bottom: 2rem; color: var(--secondary-color); text-align: center;">Login</h3>
        
        @if (errorMessage) {
          <div class="alert" style="background: #ffebee; color: #c62828; padding: 1rem; border-radius: 8px; margin-bottom: 1.5rem; border-left: 4px solid #c62828;">
            <i class="fa-solid fa-circle-exclamation"></i> {{ errorMessage }}
          </div>
        }
        
        <div class="form-group" style="margin-bottom: 1.5rem;">
          <label for="email" style="display: block; font-weight: 500; margin-bottom: 0.5rem; color: var(--secondary-color);">Email Address *</label>
          <input type="email" id="email" name="email" [(ngModel)]="loginData.email" class="form-control" placeholder="john@example.com" required [disabled]="isLoading">
        </div>
        
        <div class="form-group" style="margin-bottom: 1.5rem;">
          <label for="password" style="display: block; font-weight: 500; margin-bottom: 0.5rem; color: var(--secondary-color);">Password *</label>
          <input type="password" id="password" name="password" [(ngModel)]="loginData.password" class="form-control" placeholder="••••••••" required [disabled]="isLoading">
        </div>
        
        <button type="submit" class="btn btn-primary btn-block" style="width: 100%; display: flex; justify-content: center; align-items: center; gap: 0.5rem; padding: 1rem; font-size: 1.1rem; margin-top: 1rem;" [disabled]="isLoading">
          @if (isLoading) {
            <i class="fa-solid fa-circle-notch fa-spin"></i> Logging in...
          } @else {
            Login <i class="fa-solid fa-arrow-right-to-bracket"></i>
          }
        </button>

        <p style="text-align: center; margin-top: 2rem; color: var(--text-light);">
          Don't have an account? <a routerLink="/register" style="color: var(--primary-color); font-weight: 600;">Register here</a>
        </p>
      </form>
    </div>
  </div>
</section>
