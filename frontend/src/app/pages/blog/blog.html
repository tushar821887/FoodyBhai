<div class="page-header text-center py-5" style="background: var(--light-bg); margin-top: 2rem;">
  <div class="container animate-fade-in">
    <h1 class="page-title">Foody Bhai Blog</h1>
    <p class="text-muted" style="max-width: 600px; margin: 0 auto;">Dive into our latest articles about authentic North Indian cuisine, the secrets of our cloud kitchen, and the amazing health benefits of traditional spices.</p>
  </div>
</div>

<section class="section">
  <div class="container">
    <div class="row" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 2rem;">
      @for (post of posts; track post.id) {
        <div class="blog-card animate-fade-in" style="background: white; border-radius: 12px; overflow: hidden; box-shadow: var(--shadow-md); transition: transform 0.3s ease;">
          <img [src]="post.imageUrl" [alt]="post.title" style="width: 100%; height: 200px; object-fit: cover;">
          <div class="blog-content" style="padding: 1.5rem;">
            <div style="font-size: 0.85rem; color: var(--primary-color); margin-bottom: 0.5rem; font-weight: 600;">
              {{post.date | date:'mediumDate'}}
            </div>
            <h2 style="font-size: 1.3rem; margin-bottom: 1rem; line-height: 1.3;">
              <a [routerLink]="['/blog', post.slug]" style="color: var(--text-dark); text-decoration: none;">{{post.title}}</a>
            </h2>
            <p style="color: var(--text-light); font-size: 0.95rem; line-height: 1.5; margin-bottom: 1.5rem;">
              {{post.excerpt}}
            </p>
            <a [routerLink]="['/blog', post.slug]" class="btn btn-outline" style="width: 100%; text-align: center;">Read More</a>
          </div>
        </div>
      }
    </div>
  </div>
</section>
