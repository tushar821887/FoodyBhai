<div class="page-header">
  <div class="container animate-fade-in">
    <div class="category-nav-header">
      <button type="button" class="back-btn" (click)="goBack()" aria-label="Go back to previous page" title="Go back">
        <i class="fa-solid fa-arrow-left"></i>
        <span>Back</span>
      </button>

      <div class="breadcrumbs desktop-breadcrumbs">
        <a routerLink="/">Home</a> <i class="fa-solid fa-chevron-right breadcrumb-sep"></i> 
        <a routerLink="/menu">Menu</a> <i class="fa-solid fa-chevron-right breadcrumb-sep"></i> 
        <span>{{categoryName}}</span>
      </div>
    </div>

    <h1 class="page-title">{{categoryName}} <span>Menu</span></h1>
    <p class="page-subtitle" style="max-width: 800px; margin: 0 auto;">{{categoryDesc}}</p>
  </div>
</div>

<section class="section">
  <div class="container">
    <div class="menu-grid">
      @if (isLoading) {
        <div class="menu-card-skeleton"></div>
        <div class="menu-card-skeleton"></div>
        <div class="menu-card-skeleton"></div>
        <div class="menu-card-skeleton"></div>
      } @else if (recipes.length > 0) {
        @for (item of recipes; track item.id || item._id) {
          <app-menu-card [item]="item"></app-menu-card>
        }
      } @else {
        <div class="no-results text-center" style="grid-column: 1 / -1; padding: 4rem 0;">
          <i class="fa-solid fa-plate-wheat" style="font-size: 3rem; color: var(--text-light); margin-bottom: 1rem;"></i>
          <h3>No recipes found in this category!</h3>
          <p>We are working on adding more delicious recipes soon.</p>
          <a routerLink="/menu" class="btn btn-secondary mt-3">Browse Full Menu</a>
        </div>
      }
    </div>
  </div>
</section>
