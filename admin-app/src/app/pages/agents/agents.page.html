<div class="agents-container">
  <h2>Delivery Agents</h2>
  
  <div class="add-agent-card">
    <h3>Add New Agent</h3>
    <div class="form-group" style="display: flex; flex-direction: column; gap: 15px;">
      <div style="display: flex; gap: 15px;">
        <input type="text" placeholder="Agent Name" [(ngModel)]="newName" style="flex:1;">
        <input type="text" placeholder="Phone Number" [(ngModel)]="newPhone" style="flex:1;">
      </div>
      <div style="display: flex; gap: 15px;">
        <input type="email" placeholder="Login Email (Optional)" [(ngModel)]="newEmail" style="flex:1;">
        <input type="password" placeholder="Login Password (Optional)" [(ngModel)]="newPassword" style="flex:1;">
      </div>
      <button (click)="addAgent()" [disabled]="isAdding" style="align-self: flex-start;">Add Agent</button>
    </div>
  </div>

  <div class="agents-list">
    <div class="agent-card" *ngFor="let agent of agents">
      <!-- Read View -->
      <ng-container *ngIf="editingAgentId !== agent.id">
        <div class="agent-info">
          <h4>{{ agent.name }} <span *ngIf="agent.email" style="font-size:12px; color: #888;">({{ agent.email }})</span></h4>
          <p>📞 {{ agent.phone }}</p>
        </div>
        <div class="agent-actions" style="display: flex; gap: 10px;">
          <button class="btn-edit" (click)="startEdit(agent)" style="background: #e2e8f0; color: #334155; padding: 6px 12px; border-radius: 6px; border: none; cursor: pointer; font-weight: 500;">Edit</button>
          <button class="btn-delete" (click)="deleteAgent(agent.id)">Delete</button>
        </div>
      </ng-container>

      <!-- Edit View -->
      <ng-container *ngIf="editingAgentId === agent.id">
        <div class="edit-agent-form" style="display: flex; flex-direction: column; gap: 10px; width: 100%;">
          <div style="display: flex; gap: 10px;">
            <input type="text" placeholder="Name" [(ngModel)]="editName" style="flex:1; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px;">
            <input type="text" placeholder="Phone" [(ngModel)]="editPhone" style="flex:1; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px;">
          </div>
          <div style="display: flex; gap: 10px;">
            <input type="email" placeholder="Email" [(ngModel)]="editEmail" style="flex:1; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px;">
            <input type="password" placeholder="New Password (Optional)" [(ngModel)]="editPassword" style="flex:1; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px;">
          </div>
          <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 5px;">
            <button (click)="cancelEdit()" style="background: white; color: #64748b; padding: 6px 12px; border-radius: 6px; border: 1px solid #cbd5e1; cursor: pointer;">Cancel</button>
            <button (click)="saveEdit()" [disabled]="isSavingEdit" style="background: #3b82f6; color: white; padding: 6px 12px; border-radius: 6px; border: none; cursor: pointer;">Save</button>
          </div>
        </div>
      </ng-container>
    </div>
    <div *ngIf="agents.length === 0" class="empty-state">No agents added yet.</div>
  </div>
</div>
